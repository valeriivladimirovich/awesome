<style>
/* Layout: full-screen isometric canvas; glassy HUD pinned to the corners, thumb controls at the bottom. Single dark look by choice (a town after dark). */
:root {
  --night: #0d1120;
  --panel: rgba(17, 21, 36, .74);
  --panel-solid: #171c2e;
  --line: rgba(255, 255, 255, .13);
  --ink: #f2ede3;
  --muted: #a9acbb;
  --amber: #f2a541;
  --blood: #e0483f;
  --water: #5eaee8;
  --volt: #e9e19a;
  --display: "Russo One", "Arial Black", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--night); color: var(--ink); font-family: var(--body);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
#game { position: fixed; inset: 0; touch-action: none; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(5, 7, 14, .55) 100%); }
.hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(200, 30, 30, .38) 100%); transition: opacity .5s; }

.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.clock { padding: 8px 12px 9px; display: grid; gap: 2px; }
.clock .day { font-family: var(--display); font-size: 20px; letter-spacing: .02em; line-height: 1; }
.clock .time { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.clock .time svg { width: 14px; height: 14px; }
.clock .kills { font-size: 12px; color: var(--muted); }
.side { display: grid; gap: 8px; justify-items: end; }
.stats { padding: 9px 11px; display: grid; gap: 7px; width: 138px; }
.stat { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: center; color: var(--c); }
.stat svg { width: 16px; height: 16px; }
.meter { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.meter i { display: block; height: 100%; width: 100%; border-radius: 4px; background: var(--c); transition: width .25s linear; }
.stat.low .meter i { animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.weapon { padding: 6px 10px; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.weapon b { color: var(--ink); font-weight: 500; }
.weapon svg { width: 15px; height: 15px; color: var(--amber); }

#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 118px);
  display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(92vw, 360px); }
.toast { padding: 8px 14px; font-size: 14px; text-align: center; animation: toast 3.2s forwards; text-wrap: balance; }
.toast.warn { color: var(--amber); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

#joy { position: absolute; left: 0; bottom: 0; width: 58%; height: 62%; }
.stick { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .18); background: rgba(17, 21, 36, .35); pointer-events: none; transition: opacity .2s; }
.stick.idle { opacity: .55; }
.knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
  background: rgba(242, 237, 227, .85); box-shadow: 0 4px 14px rgba(0, 0, 0, .4); }

.controls { position: absolute; right: 0; bottom: 0;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; gap: 12px 14px; align-items: end; justify-items: center; }
.round { border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: transform .08s; touch-action: none; }
.round:active, .round.down { transform: scale(.92); }
#atk { width: 86px; height: 86px; grid-column: 2; grid-row: 2; background: rgba(224, 72, 63, .82); border-color: rgba(255, 255, 255, .25); }
#atk svg { width: 38px; height: 38px; }
#bag { width: 58px; height: 58px; grid-column: 1; grid-row: 2; }
#bag svg { width: 26px; height: 26px; }
#act { grid-column: 1 / 3; grid-row: 1; justify-self: end; padding: 12px 18px; border-radius: 999px; background: var(--amber); color: #1b1408;
  font-weight: 700; font-size: 15px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); display: flex; gap: 8px; align-items: center; }
#act svg { width: 18px; height: 18px; }

/* Bag sheet */
.sheet-wrap { position: absolute; inset: 0; background: rgba(5, 7, 14, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(100%, 520px); background: var(--panel-solid); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet header { display: flex; align-items: center; justify-content: space-between; }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 400; }
.close { width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, .07); display: grid; place-items: center; }
.close svg { width: 18px; height: 18px; }
.items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.item { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center;
  background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: left; min-width: 0; }
.item:disabled { opacity: .4; cursor: default; }
.item .ic { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .06); color: var(--c); }
.item .ic svg { width: 24px; height: 24px; }
.item b { font-weight: 500; font-size: 15px; display: flex; justify-content: space-between; gap: 6px; }
.item b span { color: var(--muted); font-variant-numeric: tabular-nums; }
.item small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.sheet .note { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

/* Title / game over */
.screen { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(8, 10, 20, .2) 0%, rgba(8, 10, 20, .55) 45%, rgba(8, 10, 20, .88) 100%); }
.screen .box { display: grid; gap: 16px; justify-items: center; max-width: 380px; }
.eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
.screen h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 13vw, 64px); line-height: .95; letter-spacing: .01em;
  text-shadow: 0 4px 30px rgba(0, 0, 0, .6); text-wrap: balance; }
.screen p { margin: 0; color: #d6d3cc; line-height: 1.5; text-wrap: pretty; }
.big { background: var(--amber); color: #1b1408; font-weight: 700; font-size: 18px; padding: 16px 40px; border-radius: 16px;
  box-shadow: 0 5px 0 #a86b1c, 0 12px 30px rgba(0, 0, 0, .4); }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #a86b1c; }
.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.howto div { padding: 10px 8px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.howto b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 2px; font-weight: 500; }
.tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.tally div { padding: 10px 6px; }
.tally b { display: block; font-family: var(--display); font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; }
.tally small { color: var(--muted); font-size: 12px; }
.best { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="game">
  <canvas id="cv" aria-label="Игровое поле"></canvas>
  <div class="vignette"></div>
  <div class="hurt" id="hurt"></div>

  <div class="hud" id="hud" hidden>
    <div class="clock glass">
      <div class="day" id="day">День 1</div>
      <div class="time"><span id="sunicon"></span><span id="time">07:00</span></div>
      <div class="kills" id="kills">Упокоено: 0</div>
    </div>
    <div class="side">
      <div class="stats glass">
        <div class="stat" id="st-hp" style="--c: var(--blood)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 16 12 21 12 21z"/></svg><span class="meter"><i></i></span></div>
        <div class="stat" id="st-food" style="--c: var(--amber)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6" y="5" width="12" height="15" rx="2"/><path d="M6 9.5h12M6 15.5h12"/></svg><span class="meter"><i></i></span></div>
        <div class="stat" id="st-water" style="--c: var(--water)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg><span class="meter"><i></i></span></div>
        <div class="stat" id="st-bat" style="--c: var(--volt)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 9h9l4-3v12l-4-3H4z"/><path d="M20 9v6"/></svg><span class="meter"><i></i></span></div>
      </div>
      <div class="weapon glass" id="weapon"></div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <div id="joy" hidden><div class="stick idle" id="stick"><div class="knob" id="knob"></div></div></div>

  <div class="controls" id="controls" hidden>
    <button id="act" hidden></button>
    <button class="round" id="bag" aria-label="Рюкзак"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 7V5a4 4 0 0 1 8 0v2"/><rect x="4" y="7" width="16" height="14" rx="4"/><path d="M8 13h8v4H8z"/></svg></button>
    <button class="round" id="atk" aria-label="Удар"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6M16 16l4 4M19 21l2-2"/></svg></button>
  </div>

  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-label="Рюкзак">
      <header><h2>Рюкзак</h2><button class="close" id="close" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="items" id="items"></div>
      <p class="note">Пока рюкзак открыт, время стоит. Еду и воду ищи в домах: подойди к двери и нажми «Обыскать».</p>
    </div>
  </div>

  <div class="screen" id="screen"></div>
</div>

<script>
(() => {
"use strict";

// ================= helpers =================
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("kvartal:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("kvartal:" + k, JSON.stringify(v)); } catch (e) {} }
};
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lerp = (a, b, t) => a + (b - a) * t;

// ================= constants =================
const TW = 64, TH = 32, HW = 32, HH = 16, WALL = 60, N = 34;
const ROADS = [6, 7, 17, 18, 28, 29];
const isRoad = i => ROADS.includes(i);
const iso = (x, y) => ({ X: (x - y) * HW, Y: (x + y) * HH });

const PAL = {
  grass: ["#6c8a4a", "#718f4e", "#688547", "#779452", "#6f8c4c"],
  tuft: "#5a7a3a", tuft2: "#86a35e",
  road: ["#3d424e", "#3f4450", "#3b404c"], mark: "#cfc28c",
  walk: ["#a19b8e", "#9b9588", "#a6a093"], walkLine: "#8a8478", curb: "#c4beb0",
  dirt: ["#8b7454", "#85704f", "#917a59"],
  walls: [["#d9c8a7", "#b5a487"], ["#a9bdc1", "#889ca1"], ["#cf9670", "#a97654"], ["#dcd5c7", "#b7b0a2"], ["#b9c39b", "#959f7a"]],
  roofs: ["#5c3e39", "#3f5562", "#6c4c3c", "#4b4b55", "#5a5a3c"],
  glass: "#2b3442", lit: "#ffd68a", door: "#4d3527",
  cars: ["#8e3d34", "#3b5b7a", "#c8b17d", "#4f5f4a", "#cfcfcb", "#6b4a6e"],
  leaves: [["#3f6b35", "#4f7f3f", "#679552"], ["#486d32", "#5b843d", "#79a254"], ["#365e3c", "#467350", "#5e8f63"]],
  trunk: "#5a4332",
  skinZ: ["#9aab89", "#8c9f82", "#a7b097", "#97a58f"],
  shirtZ: ["#6b6f5a", "#7b5a54", "#4f5d6e", "#8a7d64", "#5e4f63", "#6e6a72", "#7d6a4a"],
  pantsZ: ["#3b3f4a", "#4a4038", "#2f3a35", "#45424d"],
  blood: "#7d1d1a"
};

const ICON = {
  food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6" y="5" width="12" height="15" rx="2"/><path d="M6 9.5h12M6 15.5h12"/></svg>',
  water: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M10 2.5h4v3l2.5 3.5v11a1.5 1.5 0 0 1-1.5 1.5H9A1.5 1.5 0 0 1 7.5 20V9L10 5.5z"/><path d="M7.5 13h9"/></svg>',
  bandage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-40 12 12)"/><path d="M10.5 11.5h.01M13.5 12.5h.01M12 10h.01M12 14h.01" stroke-linecap="round" stroke-width="2.6"/></svg>',
  battery: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21.5 10.5v3M7 10v4M10.5 10v4"/></svg>',
  bat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l2.5-.5L19.5 6.5a2.1 2.1 0 0 0-3-3L3.5 16.5z"/></svg>',
  axe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L14.5 9.5"/><path d="M12 5.5c3-1.5 6.5 1.5 6.5 6.5l-2.5.5-5-5z"/></svg>',
  fists: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 11V8a2 2 0 0 1 4 0v2-3a2 2 0 0 1 4 0v3-2a2 2 0 0 1 4 0v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-5.5-3.6L4 13a1.8 1.8 0 0 1 2-2z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="#f2c45a" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#f2c45a"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="#c9d2f0"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>'
};

const ITEMS = {
  food: { name: "Консервы", desc: "+35 сытости", c: "var(--amber)" },
  water: { name: "Вода", desc: "+40 воды", c: "var(--water)" },
  bandage: { name: "Бинт", desc: "+30 здоровья", c: "var(--blood)" },
  battery: { name: "Батарейка", desc: "Фонарик на 100%", c: "var(--volt)" }
};
const WEAPONS = {
  fists: { name: "Кулаки", dmg: 1, range: 1.05, cd: 0.42, rank: 0 },
  bat: { name: "Бита", dmg: 2, range: 1.35, cd: 0.5, rank: 1 },
  axe: { name: "Топор", dmg: 3.2, range: 1.4, cd: 0.6, rank: 2 }
};
const LOOT = [["food", 30], ["water", 28], ["bandage", 14], ["battery", 12], ["bat", 8], ["axe", 5]];
const rollLoot = (min, max) => {
  const out = [], tot = LOOT.reduce((a, b) => a + b[1], 0);
  for (let n = ri(min, max); n > 0; n--) { let r = Math.random() * tot; for (const [k, w] of LOOT) { r -= w; if (r <= 0) { out.push(k); break; } } }
  return out;
};

// ================= canvas & sizing =================
const game = $("#game"), cv = $("#cv"), ctx = cv.getContext("2d");
const gc = document.createElement("canvas"), g = gc.getContext("2d");
const lc = document.createElement("canvas"), l = lc.getContext("2d");
let W = 0, H = 0, dpr = 1, S = 1, K = 1, groundScale = 1;
let world = null;

function resize() {
  W = game.clientWidth; H = game.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  S = clamp(Math.min(W / (TW * 5.4), H / (TH * 10)), 0.7, 1.5);
  K = S * dpr;
  lc.width = Math.ceil(cv.width / 2); lc.height = Math.ceil(cv.height / 2);
  if (world) renderGround();
}

// ================= sound =================
let actx = null;
function unlockAudio() {
  try {
    if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (A) actx = new A(); }
    if (actx && actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function tone(f, d, type = "sine", vol = .06, slide = 1) {
  if (!actx) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + d);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
function thud(vol = .25) {
  if (!actx) return;
  try {

// ================= map =================
function genMap() {
  const ground = Array.from({ length: N }, () => new Uint8Array(N)); // 0 grass 1 road 2 walk 3 dirt
  const solid = Array.from({ length: N }, () => new Uint8Array(N));  // 1 house 2 tree 3 car
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if (isRoad(i) || isRoad(j)) ground[i][j] = 1;
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if (ground[i][j]) continue;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const x = i + a, y = j + b;
      if (x >= 0 && y >= 0 && x < N && y < N && ground[x][y] === 1) ground[i][j] = 2;
    }
  }
  const houses = [], trees = [], cars = [], lamps = [];
  const addTree = (i, j) => {
    if (i < 0 || j < 0 || i >= N || j >= N || solid[i][j] || ground[i][j] === 1 || ground[i][j] === 2) return;
    solid[i][j] = 2;
    trees.push({ x: i + .5 + rand(-.08, .08), y: j + .5 + rand(-.08, .08), s: rand(.85, 1.2), p: pick(PAL.leaves), ph: Math.random() * 6 });
  };
  const blocks = [9, 20];
  let id = 0;
  for (const bx of blocks) for (const by of blocks) {
    const quads = shuffle([[bx, by], [bx + 4, by], [bx, by + 4], [bx + 4, by + 4]]);
    const nh = ri(2, 3);
    quads.forEach(([qx, qy], k) => {
      if (k < nh) {
        const w = ri(2, 3), h = ri(2, 3), x = qx + ri(0, 3 - w), y = qy + ri(0, 3 - h);
        for (let i = x; i < x + w; i++) for (let j = y; j < y + h; j++) solid[i][j] = 1;
        const style = ri(0, PAL.walls.length - 1);
        const dx = x + Math.floor(w / 2);
        const tiles = [];
        for (let i = x; i < x + w; i++) for (let j = y; j < y + h; j++) tiles.push([i, j]);
        houses.push({
          id: id++, x, y, w, h, wall: PAL.walls[style], roof: PAL.roofs[ri(0, PAL.roofs.length - 1)],
          doorTile: dx, door: { x: dx + .5, y: y + h + .35 },
          chimney: pick(tiles), looted: false, loot: rollLoot(2, 4),
          lit: tiles.map(() => Math.random() < .18)
        });
        // little yard path
        if (ground[dx][y + h] === 0) ground[dx][y + h] = 3;
      } else if (Math.random() < .55) {
        for (let n = ri(2, 4); n > 0; n--) addTree(qx + ri(0, 2), qy + ri(0, 2));
      } else {
        for (let i = qx; i < qx + 3; i++) for (let j = qy; j < qy + 3; j++) if (Math.random() < .7) ground[i][j] = 3;
        addTree(qx + ri(0, 2), qy + ri(0, 2));
      }
    });
  }
  // forest belts along the edges
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const edge = i === 0 || j === 0 || i === N - 1 || j === N - 1;
    const outer = i < 5 || j < 5 || i > 30 || j > 30;
    if (edge) { if (ground[i][j] === 1 || ground[i][j] === 2) solid[i][j] = 2, trees.push({ x: i + .5, y: j + .5, s: 1.1, p: pick(PAL.leaves), ph: Math.random() * 6, hidden: true }); else addTree(i, j); }
    else if (outer && Math.random() < .32) addTree(i, j);
  }
  // parked cars
  let tries = 0;
  while (cars.length < 10 && tries++ < 400) {
    const i = ri(1, N - 2), j = ri(1, N - 2);
    if (ground[i][j] !== 1 || solid[i][j] || (isRoad(i) && isRoad(j))) continue;
    if (Math.abs(i - 12) + Math.abs(j - 17) < 5) continue;
    const alongY = isRoad(i);
    // keep one lane free
    const lane = alongY ? (ROADS.indexOf(i) % 2) : (ROADS.indexOf(j) % 2);
    if (lane === 1) continue;
    solid[i][j] = 3;
    cars.push({ x: i + .5, y: j + .5, alongY, c: pick(PAL.cars), wreck: Math.random() < .35 });
  }
  // street lamps at block corners
  for (const a of [8, 16, 19, 27]) for (const b of [8, 16, 19, 27]) {
    lamps.push({ x: a + .5, y: b + .5, on: Math.random() < .7, ph: Math.random() * 10 });
  }
  return { ground, solid, houses, trees, cars, lamps };
}

// ================= ground cache =================
function diamond(c, i, j, w = 1, h = 1) {
  const a = iso(i, j), b = iso(i + w, j), d = iso(i + w, j + h), e = iso(i, j + h);
  c.beginPath(); c.moveTo(a.X, a.Y); c.lineTo(b.X, b.Y); c.lineTo(d.X, d.Y); c.lineTo(e.X, e.Y); c.closePath();
}
function renderGround() {
  const { ground, solid, houses, trees } = world.map;
  groundScale = Math.min(K, 2.4);
  gc.width = Math.ceil(N * TW * groundScale); gc.height = Math.ceil(N * TH * groundScale);
  g.setTransform(groundScale, 0, 0, groundScale, N * HW * groundScale, 0);
  g.fillStyle = PAL.grass[0]; g.fillRect(-N * HW, 0, N * TW, N * TH);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const t = ground[i][j], hv = hash(i, j);
    const col = t === 1 ? PAL.road[Math.floor(hv * 3)] : t === 2 ? PAL.walk[Math.floor(hv * 3)] : t === 3 ? PAL.dirt[Math.floor(hv * 3)] : PAL.grass[Math.floor(hv * 5)];
    diamond(g, i, j); g.fillStyle = col; g.fill();
    if (t === 2) { g.strokeStyle = PAL.walkLine; g.lineWidth = .8; g.stroke(); }
  }
  // grass tufts & pebbles
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const t = ground[i][j];
    for (let n = 0; n < 5; n++) {
      const hx = hash(i * 7 + n, j * 3 - n), hy = hash(i * 3 - n, j * 7 + n);
      const p = iso(i + hx, j + hy);
      if (t === 0) { g.strokeStyle = n % 2 ? PAL.tuft : PAL.tuft2; g.lineWidth = 1.2; g.beginPath(); g.moveTo(p.X - 2, p.Y); g.lineTo(p.X - 1, p.Y - 4); g.moveTo(p.X + 1, p.Y); g.lineTo(p.X + 2, p.Y - 3.5); g.stroke(); }
      else if (t === 3 && n < 3) { g.fillStyle = "rgba(60,45,30,.35)"; g.beginPath(); g.ellipse(p.X, p.Y, 2, 1, 0, 0, 7); g.fill(); }
      else if (t === 1 && n < 2 && hx > .6) { g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(p.X, p.Y, 6 * hy + 2, 2 * hy + 1, 0, 0, 7); g.fill(); }
    }
  }
  // curbs
  g.strokeStyle = PAL.curb; g.lineWidth = 1.6;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if (ground[i][j] !== 2) continue;
    const edge = (x1, y1, x2, y2) => { const a = iso(x1, y1), b = iso(x2, y2); g.beginPath(); g.moveTo(a.X, a.Y); g.lineTo(b.X, b.Y); g.stroke(); };
    if (i + 1 < N && ground[i + 1][j] === 1) edge(i + 1, j, i + 1, j + 1);
    if (i > 0 && ground[i - 1][j] === 1) edge(i, j, i, j + 1);
    if (j + 1 < N && ground[i][j + 1] === 1) edge(i, j + 1, i + 1, j + 1);
    if (j > 0 && ground[i][j - 1] === 1) edge(i, j, i + 1, j);
  }
  // lane dashes & crossings
  g.strokeStyle = PAL.mark; g.lineWidth = 1.4; g.globalAlpha = .7;
  for (let k = 0; k < ROADS.length; k += 2) {
    const r = ROADS[k] + 1; // boundary between the two lanes
    for (let t = 0; t < N; t++) {
      if (isRoad(t)) continue;
      const a = iso(r, t + .2), b = iso(r, t + .7); g.beginPath(); g.moveTo(a.X, a.Y); g.lineTo(b.X, b.Y); g.stroke();
      const c = iso(t + .2, r), d = iso(t + .7, r); g.beginPath(); g.moveTo(c.X, c.Y); g.lineTo(d.X, d.Y); g.stroke();
    }
  }
  g.globalAlpha = .55; g.fillStyle = "#e6e1d2";
  for (let k = 0; k < ROADS.length; k += 2) for (let m = 0; m < ROADS.length; m += 2) {
    const r = ROADS[k], c = ROADS[m];
    for (const side of [-1, 2]) for (let s = 0; s < 4; s++) {
      // zebra on the road tiles before the junction

      diamond(g, c + side + .25, r + s * .5 + .05, .5, .3); g.fill();
    }
  }

    const a = iso(h.x + h.w, h.y), b = iso(h.x + h.w + .9, h.y - .25), c = iso(h.x + h.w + .9, h.y + h.h - .25), d = iso(h.x + h.w, h.y + h.h);

  }

}

const solidAt = (x, y) => { const i = Math.floor(x), j = Math.floor(y); return i < 0 || j < 0 || i >= N || j >= N || world.map.solid[i][j] > 0; };
const blocked = (x, y, r) => solidAt(x - r, y - r) || solidAt(x + r, y - r) || solidAt(x - r, y + r) || solidAt(x + r, y + r);
function moveEnt(e, dx, dy, r = .27) {
  if (!blocked(e.x + dx, e.y, r)) e.x += dx;
  if (!blocked(e.x, e.y + dy, r)) e.y += dy;
}
function los(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / .3);
  for (let k = 1; k < n; k++) { const x = lerp(ax, bx, k / n), y = lerp(ay, by, k / n); if (world.map.solid[Math.floor(x)]?.[Math.floor(y)] === 1) return false; }

}

  const f = world.flow, s = world.map.solid, p = world.player;
  f.fill(-1);
  const q = new Int16Array(N * N * 2); let h = 0, t = 0;
  const pi = Math.floor(p.x), pj = Math.floor(p.y);
  f[pi * N + pj] = 0; q[t++] = pi; q[t++] = pj;

const nightF = m => {

};

function readMove() {
  let jx = input.jx, jy = input.jy;

    const kx = (k.has("d") || k.has("arrowright") ? 1 : 0) - (k.has("a") || k.has("arrowleft") ? 1 : 0);
    const ky = (k.has("s") || k.has("arrowdown") ? 1 : 0) - (k.has("w") || k.has("arrowup") ? 1 : 0);
    if (kx || ky) { const d = Math.hypot(kx, ky); jx = kx / d * (k.has("shift") ? 1 : .8); jy = ky / d * (k.has("shift") ? 1 : .8); }

  let dx = (jx + 2 * jy) / 2, dy = (2 * jy - jx) / 2;

// ================= actions =================
function nearDoor() {
  const p = world.player;
  for (const h of world.map.houses) if (!h.looted && Math.hypot(h.door.x - p.x, h.door.y - p.y) < 1.15) return h;
  return null;
}
function doAction() {
  const p = world.player;
  if (p.search) return;
  const h = nearDoor();
  if (!h) return;
  p.search = { h, t: 0, dur: 1.8, x: p.x, y: p.y };
  noise(p.x, p.y, 4.5);
  thud(.12);
  updateHud(true);
}
function finishSearch() {
  const p = world.player, h = p.search.h;
  p.search = null; h.looted = true; world.searched++;
  if (!h.loot.length) { toast("Пусто. Кто-то успел раньше."); updateHud(true); return; }
  const got = {};
  for (const k of h.loot) {
    if (WEAPONS[k]) {
      if (WEAPONS[k].rank > WEAPONS[p.weapon].rank) { p.weapon = k; toast(`Нашёл: ${WEAPONS[k].name}. Теперь бьёшь сильнее`); }
      else got[k] = (got[k] || 0);
    } else { p.inv[k] = (p.inv[k] || 0) + 1; got[k] = (got[k] || 0) + 1; }
  }
  const parts = Object.entries(got).filter(([k, n]) => n > 0).map(([k, n]) => ITEMS[k].name.toLowerCase() + (n > 1 ? " ×" + n : ""));
  if (parts.length) toast("В рюкзаке: " + parts.join(", "));
  h.loot = [];
  tone(520, .1, "triangle", .05, 1.5); setTimeout(() => tone(780, .14, "triangle", .05, 1.2), 90);
  updateHud(true);
}
function attack() {
  if (!world || world.mode !== "play" || paused) return;
  const p = world.player, w = WEAPONS[p.weapon];
  if (p.cool > 0) return;
  p.cool = w.cd; p.swing = .28;
  if (p.search) p.search = null;
  // aim assist: turn to the nearest zombie in reach
  let near = null, nd = w.range + .6;
  for (const z of world.zombies) { const d = Math.hypot(z.x - p.x, z.y - p.y); if (d < nd) { nd = d; near = z; } }
  if (near) { p.face = Math.atan2(near.y - p.y, near.x - p.x); }
  let hitAny = false;
  for (const z of world.zombies) {
    const dx = z.x - p.x, dy = z.y - p.y, d = Math.hypot(dx, dy);
    if (d > w.range + .25) continue;
    let da = Math.abs(Math.atan2(dy, dx) - p.face); if (da > Math.PI) da = Math.PI * 2 - da;
    if (da > 1.15 && d > .55) continue;
    hitAny = true;
    z.hp -= w.dmg; z.hit = .15; z.state = "chase";
    const kb = p.weapon === "fists" ? .45 : .6;
    z.kx = dx / (d || 1) * kb * 6; z.ky = dy / (d || 1) * kb * 6;
    z.atkT = 0; z.cool = Math.max(z.cool, .45);
    bleed(z.x, z.y, 6);
    if (z.hp <= 0) killZombie(z);
  }
  noise(p.x, p.y, hitAny ? 6 : 3.5);
  if (hitAny) { thud(.3); world.shake = Math.max(world.shake, 4); } else tone(240, .08, "triangle", .03, .6);
}
function bleed(x, y, n) {
  for (let i = 0; i < n; i++) world.parts.push({ x, y, z: rand(.6, 1.1), vx: rand(-1.6, 1.6), vy: rand(-1.6, 1.6), vz: rand(.5, 2.5), life: 1 });
}
function killZombie(z) {
  world.zombies.splice(world.zombies.indexOf(z), 1);
  world.kills++;
  world.corpses.push({ x: z.x, y: z.y, rot: Math.random() < .5 ? -1 : 1, shirt: z.shirt, skin: z.skin, pants: z.pants, t: 0 });
  if (world.corpses.length > 40) world.corpses.shift();
  bleed(z.x, z.y, 10);
  world.decals.push({ x: z.x + rand(-.2, .2), y: z.y + rand(-.2, .2), r: rand(.35, .55) });
  tone(110, .35, "sawtooth", .04, .5);
}

// ================= update =================
function update(dt) {
  const W_ = world, p = W_.player, mode = W_.mode;
  // time
  if (mode === "play") {
    const before = W_.time;
    W_.time += dt * 4; W_.elapsed += dt * 4;
    if (W_.time >= 1440) { W_.time -= 1440; W_.day++; }
    const crossed = h => before < h * 60 && W_.time >= h * 60 || (before > W_.time && h * 60 <= W_.time);
    if (crossed(19.5)) toast("Темнеет. Ночью зомби злее и их больше. Найди батарейки", true);
    if (crossed(21)) {
      toast("Ночь. Фонарик включён, но он светит и для них тоже", true);
      const n = Math.min(70 - W_.zombies.length, 5 + W_.day * 3);
      for (let i = 0; i < n; i++) spawnZombie(11);
    }
    if (crossed(6.5)) {
      toast(`Рассвет. Ты пережил ночь ${W_.day - 1 || ""}`.trim());
      for (const h of W_.map.houses) if (h.looted && Math.random() < .35) { h.looted = false; h.loot = rollLoot(1, 2); }
      for (let i = 0; i < 3; i++) spawnZombie(10);
    }
  }
  const nf = nightF(W_.time);

  // player
  if (mode === "play") {
    const mv = readMove();
    p.moving = mv.m > 0;
    p.sprint = mv.m > .92;
    if (p.moving) {
      const sp = (p.sprint ? 3.3 : 2.2 * Math.min(1, mv.m / .85 + .15));
      moveEnt(p, mv.dx * sp * dt, mv.dy * sp * dt, .26);
      p.face = Math.atan2(mv.dy, mv.dx);
      p.walk += dt * sp * 3.2;
      p.noiseT -= dt;
      if (p.noiseT <= 0) { p.noiseT = .5; noise(p.x, p.y, p.sprint ? 4.5 : 1.6); }
      if (p.search && Math.hypot(p.x - p.search.x, p.y - p.search.y) > .25) { p.search = null; toast("Обыск прерван"); }
    }
    const sx = Math.cos(p.face) - Math.sin(p.face);
    if (Math.abs(sx) > .05) p.sf = sx > 0 ? 1 : -1;
    if (p.search) { p.search.t += dt; if (p.search.t >= p.search.dur) finishSearch(); }
    p.cool -= dt; p.swing = Math.max(0, p.swing - dt); p.hurtT = Math.max(0, p.hurtT - dt);
    p.food -= dt * 100 / 420 * (p.sprint ? 1.5 : 1);
    p.water -= dt * 100 / 330 * (p.sprint ? 1.6 : 1);
    p.food = Math.max(0, p.food); p.water = Math.max(0, p.water);
    if (p.food <= 0 || p.water <= 0) { p.hp -= dt * 1.4; if (!W_.events.has("starve")) { W_.events.add("starve"); toast(p.food <= 0 ? "Голод отнимает силы. Поешь" : "Жажда отнимает силы. Попей", true); } }
    else W_.events.delete("starve");
    if (p.food > 45 && p.water > 45 && p.hp < 100) p.hp = Math.min(100, p.hp + dt * .45);
    if (nf > .5 && p.bat > 0) { p.bat = Math.max(0, p.bat - dt * .42); if (p.bat === 0) toast("Фонарик сел. Батарейка в рюкзаке?", true); }
    if (p.hp <= 0) return gameOver();
  }
  const flash = mode === "play" && nf > .5 && p.bat > 0;
  const lamplit = W_.map.lamps.some(L => L.on && Math.hypot(L.x - p.x, L.y - p.y) < 3.2);

  // flow field
  W_.flowT -= dt;
  if (W_.flowT <= 0 && mode === "play") { W_.flowT = .3; buildFlow(); }

  // zombies
  for (const z of W_.zombies) {
    z.think -= dt; z.hit = Math.max(0, z.hit - dt); z.cool -= dt;
    const dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy);
    if (mode === "play" && z.think <= 0) {
      z.think = .25 + Math.random() * .15;
      const sight = nf > .5 ? (flash || lamplit ? 6.5 : 3) : 7.5;
      if (d < sight && los(z.x, z.y, p.x, p.y)) {
        if (z.state !== "chase" && d < 9 && Math.random() < .5) groan();
        z.state = "chase"; z.lx = p.x; z.ly = p.y; z.lost = 0;
      } else if (z.state === "chase") {
        z.lost = (z.lost || 0) + .3;
        if (z.lost > 3.5) { z.state = "investigate"; z.tx = z.lx; z.ty = z.ly; }
      }
    }
    let tx = null, ty = null, sp = z.spd * (nf > .5 ? 1.25 : 1);
    if (z.state === "chase" && mode === "play") {
      if (d < .82) {
        if (z.atkT <= 0 && z.cool <= 0) z.atkT = .38;
      } else {
        const st = d > 1.4 ? flowStep(z) : null;
        if (st) { tx = st.x; ty = st.y; } else { tx = p.x; ty = p.y; }
      }
    } else if (z.state === "investigate") {
      tx = z.tx; ty = z.ty; sp *= .8;
      if (Math.hypot(z.tx - z.x, z.ty - z.y) < .4) z.state = "wander";
    } else {
      z.wanderT -= dt; sp *= .35;
      if (z.wanderT <= 0) { z.wanderT = rand(2, 6); z.tx = clamp(z.x + rand(-3, 3), 1, N - 1); z.ty = clamp(z.y + rand(-3, 3), 1, N - 1); }
      if (Math.hypot(z.tx - z.x, z.ty - z.y) > .3) { tx = z.tx; ty = z.ty; }
    }
    if (z.atkT > 0) {
      z.atkT -= dt;
      if (z.atkT <= 0) {
        z.cool = 1.15;
        if (mode === "play" && d < 1.05) {
          const dmg = rand(8, 13) * (nf > .5 ? 1.15 : 1);
          p.hp -= dmg; p.hurtT = .3; W_.shake = 9; hurtFlash(); thud(.35); tone(180, .18, "square", .03, .6);
          if (p.search) { p.search = null; }
          const kd = d || 1; moveEnt(p, dx / kd * .25, dy / kd * .25);
          if (p.hp <= 0) return gameOver();
        }
      }
    }
    if (tx !== null && z.atkT <= 0) {
      const ddx = tx - z.x, ddy = ty - z.y, dd = Math.hypot(ddx, ddy) || 1;
      moveEnt(z, ddx / dd * sp * dt, ddy / dd * sp * dt);
      z.ph += dt * sp * 3;
      const sx = ddx - ddy; if (Math.abs(sx) > .05) z.face = sx > 0 ? 1 : -1;
      // unstick: if barely moving, sidestep
    }
    if (z.kx || z.ky) { moveEnt(z, z.kx * dt, z.ky * dt); z.kx *= Math.pow(.002, dt); z.ky *= Math.pow(.002, dt); if (Math.abs(z.kx) + Math.abs(z.ky) < .05) z.kx = z.ky = 0; }
    z.groanT -= dt;
    if (z.groanT <= 0) { z.groanT = rand(6, 16); if (mode === "play" && d < 7) groan(); }
  }
  // separation
  const zs = W_.zombies;
  for (let i = 0; i < zs.length; i++) for (let j = i + 1; j < zs.length; j++) {
    const a = zs[i], b = zs[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if (d2 < .36 && d2 > 1e-6) { const d = Math.sqrt(d2), push = (.6 - d) * .5; moveEnt(a, -dx / d * push, -dy / d * push); moveEnt(b, dx / d * push, dy / d * push); }
  }
  if (mode === "play") for (const z of zs) {
    const dx = p.x - z.x, dy = p.y - z.y, d = Math.hypot(dx, dy);
    if (d < .5 && d > 1e-6) { const push = (.5 - d); moveEnt(z, -dx / d * push, -dy / d * push); }
  }
  // particles
  for (let i = W_.parts.length - 1; i >= 0; i--) {
    const q = W_.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt; q.vz -= 9 * dt; q.z += q.vz * dt;
    if (q.z <= 0) { if (W_.decals.length < 220 && Math.random() < .5) W_.decals.push({ x: q.x, y: q.y, r: rand(.05, .12) }); W_.parts.splice(i, 1); }
  }
  for (const c of W_.corpses) c.t += dt;
  W_.shake = Math.max(0, W_.shake - dt * 30);

  // camera
  let target;
  if (mode === "title") { W_.panT = (W_.panT || 0) + dt * .05; target = iso(N / 2 + Math.cos(W_.panT) * 7, N / 2 + Math.sin(W_.panT * 1.3) * 7); }
  else target = iso(p.x, p.y);
  const k = 1 - Math.pow(.0005, dt);
  W_.camX = lerp(W_.camX, target.X, k); W_.camY = lerp(W_.camY, target.Y - 10, k);

  if (mode === "play") { hudT -= dt; if (hudT <= 0) { hudT = .2; updateHud(); } }
}

// ================= drawing =================
function drawHouseTile(c, h, i, j, nf) {
  const top = (x, y) => { const q = iso(x, y); return { X: q.X, Y: q.Y - WALL }; };
  const quad = (a, b, cc, d, fill) => { c.beginPath(); c.moveTo(a.X, a.Y); c.lineTo(b.X, b.Y); c.lineTo(cc.X, cc.Y); c.lineTo(d.X, d.Y); c.closePath(); c.fillStyle = fill; c.fill(); };

    const L = iso(i, j + 1), R = iso(i + 1, j + 1);
    quad(L, R, { X: R.X, Y: R.Y - WALL }, { X: L.X, Y: L.Y - WALL }, h.wall[0]);

    const P = (t, v) => ({ X: lerp(L.X, R.X, t), Y: lerp(L.Y, R.Y, t) - v });

      c.fillStyle = "#d9b45a"; c.beginPath(); const kn = P(.62, 17); c.arc(kn.X, kn.Y, 1.3, 0, 7); c.fill();
      quad(P(.25, 36), P(.75, 36), P(.75, 40), P(.25, 40), "rgba(0,0,0,.25)");

        const a = P(.36, 30), b = P(.64, 8), a2 = P(.64, 30), b2 = P(.36, 8);

      if (!lit) { c.fillStyle = "rgba(255,255,255,.12)"; quad(P(.3, 30), P(.42, 30), P(.42, 41), P(.3, 41), "rgba(255,255,255,.12)"); }
      c.strokeStyle = h.wall[1]; c.lineWidth = 1.5; const m1 = P(.5, 20), m2 = P(.5, 42); c.beginPath(); c.moveTo(m1.X, m1.Y); c.lineTo(m2.X, m2.Y); c.stroke();
      quad(P(.24, 18), P(.76, 18), P(.76, 20.5), P(.24, 20.5), "rgba(255,255,255,.25)");
    }
    quad(L, R, { X: R.X, Y: R.Y - 4 }, { X: L.X, Y: L.Y - 4 }, "rgba(0,0,0,.18)");
  }
  // east face
  if (i === h.x + h.w - 1) {
    const L = iso(i + 1, j + 1), R = iso(i + 1, j);
    quad(L, R, { X: R.X, Y: R.Y - WALL }, { X: L.X, Y: L.Y - WALL }, h.wall[1]);
    c.strokeStyle = "rgba(0,0,0,.08)"; c.lineWidth = 1;
    for (let v = 12; v < WALL; v += 9) { c.beginPath(); c.moveTo(L.X, L.Y - v); c.lineTo(R.X, R.Y - v); c.stroke(); }
    const P = (t, v) => ({ X: lerp(L.X, R.X, t), Y: lerp(L.Y, R.Y, t) - v });
    const lit = h.lit[(idx + 1) % h.lit.length] && nf > .3;
    quad(P(.3, 20), P(.7, 20), P(.7, 40), P(.3, 40), lit ? PAL.lit : "#252d39");
    quad(P(.26, 18), P(.74, 18), P(.74, 20.5), P(.26, 20.5), "rgba(255,255,255,.18)");
    quad(L, R, { X: R.X, Y: R.Y - 4 }, { X: L.X, Y: L.Y - 4 }, "rgba(0,0,0,.2)");
  }
  // roof tile
  const a = top(i, j), b = top(i + 1, j), d = top(i + 1, j + 1), e = top(i, j + 1);
  c.beginPath(); c.moveTo(a.X, a.Y); c.lineTo(b.X, b.Y); c.lineTo(d.X, d.Y); c.lineTo(e.X, e.Y); c.closePath();
  c.fillStyle = h.roof; c.fill();
  c.fillStyle = `rgba(255,255,255,${.03 + hash(i, j) * .05})`; c.fill();

    const t1 = top(cx0, cy0), t2 = top(cx0 + s, cy0), t3 = top(cx0 + s, cy0 + s), t4 = top(cx0, cy0 + s);
    quad({ X: t1.X, Y: t1.Y - ch }, { X: t2.X, Y: t2.Y - ch }, { X: t3.X, Y: t3.Y - ch }, { X: t4.X, Y: t4.Y - ch }, "#3a2a24");
  }
}

  // wheels
  c.fillStyle = "#15171c";
  for (const [wx, wy] of car.alongY ? [[x1, y0 + .14], [x1, y1 - .14]] : [[x0 + .14, y1], [x1 - .14, y1]]) { const q = pt(wx, wy, 3); c.beginPath(); c.ellipse(q.X, q.Y, 4.5, 4, 0, 0, 7); c.fill(); }
}
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a), 0, 255);
  return `rgb(${f(r)},${f(gg)},${f(b)})`;
}
function drawLampPost(c, L, nf) {
  const p = iso(L.x, L.y);
  c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(p.X, p.Y, 5, 2.5, 0, 0, 7); c.fill();
  c.strokeStyle = "#2c313a"; c.lineWidth = 3; c.beginPath(); c.moveTo(p.X, p.Y); c.lineTo(p.X, p.Y - 70); c.lineTo(p.X + 9, p.Y - 74); c.stroke();
  const on = L.on && nf > .15;
  c.fillStyle = on ? "#ffe3a3" : "#555b66"; c.beginPath(); c.ellipse(p.X + 11, p.Y - 72, 5, 2.6, 0, 0, 7); c.fill();
}

function drawHuman(c, x, y, o) {
  const f = o.face, w = o.walk || 0, sw = Math.sin(w) * (o.moving ? 1 : 0);
  const lean = o.zombie ? f * 2.5 : 0, bob = o.moving ? Math.abs(Math.sin(w)) * 1.4 : 0;
  // shadow
  c.fillStyle = "rgba(0,0,0,.3)"; c.beginPath(); c.ellipse(x, y, 11, 5, 0, 0, 7); c.fill();
  c.lineCap = "round";
  // legs
  c.strokeStyle = o.pants; c.lineWidth = 5;
  c.beginPath(); c.moveTo(x - 3, y - 16); c.lineTo(x - 3 + sw * 4 * f, y - 1.5);
  c.moveTo(x + 3, y - 16); c.lineTo(x + 3 - sw * 4 * f, y - 1.5); c.stroke();
  const by = y - bob;
  // back arm
  c.strokeStyle = o.sleeve || o.shirt; c.lineWidth = 4.5;
  c.beginPath(); c.moveTo(x - f * 5 + lean, by - 29);
  if (o.zombie) c.lineTo(x + f * 13 + lean, by - 27 + Math.sin(o.ph * 1.3) * 1.5);
  else c.lineTo(x - f * 6 - sw * 3 * f, by - 17); c.stroke();
  // backpack
  if (o.pack) { c.fillStyle = o.pack; roundRect(c, x - f * 11 - 4, by - 31, 8, 13, 3); c.fill(); }
  // torso
  c.fillStyle = o.shirt; roundRect(c, x - 7 + lean * .6, by - 33, 14, 18, 5); c.fill();
  if (o.stain) { c.fillStyle = "rgba(90,20,18,.55)"; c.beginPath(); c.ellipse(x + 2 + lean * .6, by - 22, 4, 3, .4, 0, 7); c.fill(); }
  if (o.zip) { c.strokeStyle = "rgba(0,0,0,.25)"; c.lineWidth = 1; c.beginPath(); c.moveTo(x + f * 1.5, by - 32); c.lineTo(x + f * 1.5, by - 16); c.stroke(); }
  // head
  const hx = x + f * 1.5 + lean * 1.2, hy = by - 39;
  c.fillStyle = o.skin; c.beginPath(); c.arc(hx, hy, 6.2, 0, 7); c.fill();
  if (o.hair) { c.fillStyle = o.hair; c.beginPath(); c.arc(hx - f * .8, hy - 1.6, 6.3, Math.PI * 1.05, Math.PI * 1.95); c.fill(); c.fillRect(hx - f * 6.2 - (f > 0 ? 0 : -1.2) , hy - 3, 2.4, 5); }
  if (o.zombie) {
    c.fillStyle = "rgba(30,30,20,.55)"; c.beginPath(); c.arc(hx + f * 2.6, hy - .5, 1.5, 0, 7); c.fill();
    c.fillStyle = "rgba(60,20,20,.5)"; c.fillRect(hx + f * 1.5 - 1.5, hy + 2.5, 3.5, 1.2);
  } else { c.fillStyle = "#2a2420"; c.beginPath(); c.arc(hx + f * 3, hy - .3, 1.1, 0, 7); c.fill(); }
  // front arm
  c.strokeStyle = o.sleeve || o.shirt; c.lineWidth = 4.5;
  c.beginPath(); c.moveTo(x + f * 5 + lean, by - 29);
  let hand;
  if (o.zombie) hand = { X: x + f * 15 + lean, Y: by - 25 + Math.sin(o.ph * 1.3 + 1) * 1.5 };
  else if (o.swing > 0) { const t = 1 - o.swing / .28, a = -1.9 + t * 2.6; hand = { X: x + f * (5 + Math.cos(a) * 12), Y: by - 29 + Math.sin(a) * 12 }; }
  else hand = { X: x + f * 6 + sw * 3 * f, Y: by - 17 };
  c.lineTo(hand.X, hand.Y); c.stroke();
  c.fillStyle = o.skin; c.beginPath(); c.arc(hand.X, hand.Y, 2.4, 0, 7); c.fill();
  // weapon
  if (o.weapon && o.weapon !== "fists") {
    const ang = o.swing > 0 ? (-1.9 + (1 - o.swing / .28) * 2.6) : -0.5;
    const len = o.weapon === "axe" ? 17 : 19;
    const ex = hand.X + f * Math.cos(ang) * len, ey = hand.Y + Math.sin(ang) * len;
    c.strokeStyle = o.weapon === "axe" ? "#6e4a2c" : "#b88a52"; c.lineWidth = o.weapon === "axe" ? 2.6 : 3.6;
    c.beginPath(); c.moveTo(hand.X, hand.Y); c.lineTo(ex, ey); c.stroke();
    if (o.weapon === "axe") { c.fillStyle = "#b9c0c8"; c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex + f * 6, ey - 2); c.lineTo(ex + f * 5, ey + 6); c.closePath(); c.fill(); }
  }
  c.lineCap = "butt";
  if (o.swing > 0) {
    const t = 1 - o.swing / .28;
    c.strokeStyle = `rgba(255,255,255,${.5 * (1 - t)})`; c.lineWidth = 3;
    c.beginPath(); c.ellipse(x + f * 10, by - 22, 18, 9, 0, f > 0 ? -1.4 : Math.PI - .6, f > 0 ? .6 : Math.PI + 1.4); c.stroke();
  }
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }

function drawCorpse(c, z) {
  const p = iso(z.x, z.y), a = Math.min(1, Math.max(0, 1 - (z.t - 40) / 6));
  if (a <= 0) return;
  c.globalAlpha = a;
  c.save(); c.translate(p.X, p.Y); c.scale(1, .55); c.rotate(z.rot * .5);
  c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(0, 0, 22, 9, 0, 0, 7); c.fill();
  c.fillStyle = z.pants; roundRect(c, -18, -4, 14, 8, 3); c.fill();
  c.fillStyle = z.shirt; roundRect(c, -6, -6, 16, 12, 4); c.fill();
  c.fillStyle = z.skin; c.beginPath(); c.arc(14, 0, 5.5, 0, 7); c.fill();
  c.restore(); c.globalAlpha = 1;
}

function draw(time) {
  const W_ = world, p = W_.player, nf = nightF(W_.time), df = duskF(W_.time);
  const sh = W_.shake, ox = sh ? rand(-sh, sh) : 0, oy = sh ? rand(-sh, sh) : 0;
  const tx = Math.round(cv.width / 2 - W_.camX * K + ox * dpr), ty = Math.round(cv.height / 2 - W_.camY * K + oy * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#2f4a2a"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(K, 0, 0, K, tx, ty);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(gc, -N * HW, 0, N * TW, N * TH);
  // view bounds in iso px
  const vx0 = W_.camX - W / 2 / S - 80, vx1 = W_.camX + W / 2 / S + 80, vy0 = W_.camY - H / 2 / S - 60, vy1 = W_.camY + H / 2 / S + 140;
  const vis = (x, y) => { const q = iso(x, y); return q.X > vx0 && q.X < vx1 && q.Y > vy0 && q.Y < vy1; };
  // decals
  ctx.fillStyle = PAL.blood;
  for (const d of W_.decals) { if (!vis(d.x, d.y)) continue; const q = iso(d.x, d.y); ctx.globalAlpha = .75; ctx.beginPath(); ctx.ellipse(q.X, q.Y, d.r * 40, d.r * 20, 0, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const z of W_.corpses) if (vis(z.x, z.y)) drawCorpse(ctx, z);
  // search marker / door hints
  if (W_.mode === "play") {
    for (const h of W_.map.houses) {
      if (h.looted || !vis(h.door.x, h.door.y)) continue;
      const q = iso(h.door.x, h.door.y - .25);
      const near = Math.hypot(h.door.x - p.x, h.door.y - p.y) < 1.15;
      ctx.strokeStyle = near ? "rgba(242,165,65,.95)" : "rgba(242,165,65,.45)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(q.X, q.Y, 14 + Math.sin(time * 4) * 1.5, 7 + Math.sin(time * 4) * .75, 0, 0, 7); ctx.stroke();
    }
  }
  // sortable objects
  const objs = [];
  for (const h of W_.map.houses) for (let i = h.x; i < h.x + h.w; i++) for (let j = h.y; j < h.y + h.h; j++) if (vis(i + .5, j + .5)) objs.push({ k: i + j + 1, t: 0, h, i, j });
  for (const t of W_.map.trees) if (vis(t.x, t.y)) objs.push({ k: t.x + t.y, t: 1, o: t });
  for (const car of W_.map.cars) if (vis(car.x, car.y)) objs.push({ k: car.x + car.y, t: 2, o: car });
  for (const L of W_.map.lamps) if (vis(L.x, L.y)) objs.push({ k: L.x + L.y, t: 3, o: L });
  for (const z of W_.zombies) if (vis(z.x, z.y)) objs.push({ k: z.x + z.y, t: 4, o: z });
  if (W_.mode === "play") objs.push({ k: p.x + p.y, t: 5 });
  objs.sort((a, b) => a.k - b.k);
  for (const ob of objs) {
    if (ob.t === 0) drawHouseTile(ctx, ob.h, ob.i, ob.j, nf);
    else if (ob.t === 1) drawTree(ctx, ob.o, time);
    else if (ob.t === 2) drawCar(ctx, ob.o);
    else if (ob.t === 3) drawLampPost(ctx, ob.o, nf);
    else if (ob.t === 4) {
      const z = ob.o, q = iso(z.x, z.y);
      const lunge = z.atkT > 0 ? (1 - z.atkT / .38) * 4 : 0;
      drawHuman(ctx, q.X + z.face * lunge, q.Y, { face: z.face, walk: z.ph, moving: true, zombie: true, ph: z.ph + time, skin: z.hit > 0 ? "#fff" : z.skin, shirt: z.hit > 0 ? "#fff" : z.shirt, pants: z.pants, stain: z.stain });
    } else {
      const q = iso(p.x, p.y);
      drawHuman(ctx, q.X, q.Y, { face: p.sf, walk: p.walk, moving: p.moving, skin: p.hurtT > 0 ? "#ffb0a8" : "#e2b693", hair: "#3a2a20", shirt: "#e0782f", sleeve: "#c9661f", pants: "#34404f", pack: "#4c5a3a", zip: true, swing: p.swing, weapon: p.weapon });
    }
  }
  // x-ray outline of the player when hidden behind buildings
  if (W_.mode === "play") {
    const q = iso(p.x, p.y);
    ctx.globalAlpha = .28;
    ctx.fillStyle = "#e0782f"; roundRect(ctx, q.X - 7, q.Y - 33, 14, 18, 5); ctx.fill();
    ctx.beginPath(); ctx.arc(q.X, q.Y - 39, 6, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    // search progress
    if (p.search) {
      const t = p.search.t / p.search.dur;
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.beginPath(); ctx.arc(q.X, q.Y - 60, 10, 0, 7); ctx.stroke();
      ctx.strokeStyle = "#f2a541"; ctx.beginPath(); ctx.arc(q.X, q.Y - 60, 10, -Math.PI / 2, -Math.PI / 2 + t * Math.PI * 2); ctx.stroke();
    }
  }
  // particles
  ctx.fillStyle = "#9e2620";
  for (const q of W_.parts) { const s = iso(q.x, q.y); ctx.beginPath(); ctx.arc(s.X, s.Y - q.z * 26, 1.8, 0, 7); ctx.fill(); }

  // dusk tint
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (df > 0) { ctx.fillStyle = `rgba(255,120,60,${.16 * df})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  // darkness + lights
  if (nf > .02) {
    const L = l, sc = .5;
    const scr = (x, y) => { const q = iso(x, y); return { x: (q.X * K + tx) * sc, y: (q.Y * K + ty) * sc }; };
    L.setTransform(1, 0, 0, 1, 0, 0);
    L.globalCompositeOperation = "source-over";
    L.clearRect(0, 0, lc.width, lc.height);
    L.fillStyle = `rgba(6,10,28,${.86 * nf})`; L.fillRect(0, 0, lc.width, lc.height);
    L.globalCompositeOperation = "destination-out";
    const R1 = Math.SQRT2 * HW * K * sc; // px per tile radius (horizontal)
    const ellipseLight = (cx, cy, r, a = 1) => {
      L.save(); L.translate(cx, cy); L.scale(1, .5);
      const gr = L.createRadialGradient(0, 0, 0, 0, 0, r);
      gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(.55, `rgba(0,0,0,${a * .75})`); gr.addColorStop(1, "rgba(0,0,0,0)");
      L.fillStyle = gr; L.beginPath(); L.arc(0, 0, r, 0, 7); L.fill(); L.restore();
    };
    for (const lp of W_.map.lamps) {
      if (!lp.on) continue;
      const flick = lp.ph > 8 ? (Math.sin(time * 23 + lp.ph) > .6 ? .35 : 1) : 1;
      const s = scr(lp.x + .3, lp.y + .3); ellipseLight(s.x, s.y, R1 * 3.3, .95 * flick);
    }
    for (const h of W_.map.houses) h.lit.forEach((on, k) => { if (on) { const s = scr(h.x + h.w / 2, h.y + h.h + .4); ellipseLight(s.x, s.y, R1 * 1.2, .5); } });
    if (W_.mode === "play") {
      const ps = scr(p.x, p.y);
      ellipseLight(ps.x, ps.y - 10 * K * sc, R1 * 1.7, .9);
      if (p.bat > 0) {
        const len = 6.5 * (p.bat < 15 ? .6 + Math.random() * .3 : 1), spread = .5;
        L.beginPath(); L.moveTo(ps.x, ps.y - 10 * K * sc);
        for (let k = 0; k <= 14; k++) { const a = p.face - spread + spread * 2 * k / 14, s = scr(p.x + Math.cos(a) * len, p.y + Math.sin(a) * len); L.lineTo(s.x, s.y); }
        L.closePath();
        const gr = L.createRadialGradient(ps.x, ps.y, 0, ps.x, ps.y, R1 * len * .95);
        gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(.7, "rgba(0,0,0,.85)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        L.fillStyle = gr; L.fill();
      }
    }
    ctx.drawImage(lc, 0, 0, cv.width, cv.height);
    // warm glows & eyes
    ctx.setTransform(K, 0, 0, K, tx, ty);
    ctx.globalCompositeOperation = "lighter";
    for (const lp of W_.map.lamps) {
      if (!lp.on || !vis(lp.x, lp.y)) continue;
      const q = iso(lp.x, lp.y), gr = ctx.createRadialGradient(q.X + 11, q.Y - 72, 0, q.X + 11, q.Y - 72, 26);
      gr.addColorStop(0, `rgba(255,214,140,${.55 * nf})`); gr.addColorStop(1, "rgba(255,214,140,0)");
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(q.X + 11, q.Y - 72, 26, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    if (W_.mode === "play") for (const z of W_.zombies) {
      const d = Math.hypot(z.x - p.x, z.y - p.y);
      if (d > 8 || !vis(z.x, z.y)) continue;
      const q = iso(z.x, z.y), hx = q.X + z.face * 1.5 + z.face * 3, hy = q.Y - 40;
      ctx.fillStyle = `rgba(230,240,190,${.75 * nf * (1 - d / 8)})`;
      ctx.beginPath(); ctx.arc(hx + z.face * 1.5, hy, 1.1, 0, 7); ctx.arc(hx - z.face * 1.5, hy, 1.1, 0, 7); ctx.fill();
    }
  }
  // off-screen threat markers
  if (W_.mode === "play") {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const z of W_.zombies) {
      if (z.state !== "chase") continue;
      const q = iso(z.x, z.y), sx = (q.X - W_.camX) * S + W / 2, sy = (q.Y - 30 - W_.camY) * S + H / 2;
      if (sx > 0 && sx < W && sy > 0 && sy < H) continue;
      const cx = clamp(sx, 22, W - 22), cy = clamp(sy, 90, H - 22), a = Math.atan2(sy - H / 2, sx - W / 2);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
      ctx.fillStyle = "rgba(224,72,63,.85)"; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

// ================= screens =================
const screen = $("#screen");
function fmtSurvived(min) {
  const d = Math.floor(min / 1440), h = Math.floor(min % 1440 / 60);
  const pl = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c;
  return (d ? `${d} ${pl(d, "день", "дня", "дней")} ` : "") + `${h} ${pl(h, "час", "часа", "часов")}`;
}
function showTitle() {
  newWorld("title");
  setPlayUI(false);
  const best = store.get("best", null);
  screen.innerHTML = `<div class="box">
    <span class="eyebrow">Выживание · ночь за ночью</span>
    <h1>Последний квартал</h1>
    <p>Городок опустел, на улицах бродят мертвецы. Обыскивай дома, следи за едой и водой и переживи как можно больше ночей.</p>
    <button class="big" id="start">Начать</button>
    <div class="howto">
      <div class="glass"><b>Левый палец</b>Ходьба. До упора — бег, но шумно</div>
      <div class="glass"><b>Красная кнопка</b>Удар. Ищи биту или топор</div>
      <div class="glass"><b>У двери</b>«Обыскать дом» — еда, вода, бинты</div>
    </div>
    ${best ? `<span class="best">Рекорд: ${fmtSurvived(best)}</span>` : ""}
  </div>`;
  screen.hidden = false;
  $("#start").addEventListener("click", () => { unlockAudio(); startGame(); });
}
function setPlayUI(on) {
  $("#hud").hidden = !on; $("#controls").hidden = !on; $("#joy").hidden = !on;
  if (on) placeStickIdle();
}
function startGame() {
  newWorld("play");
  screen.hidden = true; paused = false; $("#sheet").hidden = true;
  setPlayUI(true); updateHud(true);
  buildFlow();
  toast("Утро, 7:00. Найди еду и воду до темноты");
  tone(330, .2, "triangle", .05, 1.5);
}
function gameOver() {
  const W_ = world;
  W_.mode = "dead";
  setPlayUI(false); $("#sheet").hidden = true;
  const best = store.get("best", 0), rec = W_.elapsed > best;
  if (rec) store.set("best", Math.floor(W_.elapsed));
  tone(200, 1.2, "sawtooth", .05, .3);
  screen.innerHTML = `<div class="box">
    <span class="eyebrow">${rec ? "Новый рекорд" : "Конец истории"}</span>
    <h1>Тебя настигли</h1>
    <div class="tally">
      <div class="glass"><b>${fmtSurvived(W_.elapsed)}</b><small>продержался</small></div>
      <div class="glass"><b>${W_.kills}</b><small>упокоено</small></div>
      <div class="glass"><b>${W_.searched}</b><small>домов обыскано</small></div>
    </div>
    <button class="big" id="again">Ещё раз</button>
    ${!rec && best ? `<span class="best">Рекорд: ${fmtSurvived(best)}</span>` : ""}
  </div>`;
  screen.hidden = false;
  $("#again").addEventListener("click", () => { unlockAudio(); startGame(); });
}
document.addEventListener("visibilitychange", () => { if (document.hidden && world && world.mode === "play") toggleBag(true); });

// ================= loop =================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!world) return;
  if (!paused && world.mode !== "dead") update(dt);
  draw(now / 1000);
}
window.addEventListener("resize", () => { resize(); if (world && world.mode === "play") placeStickIdle(); });
resize();
showTitle();
requestAnimationFrame(frame);
})();
</script>
</html>
