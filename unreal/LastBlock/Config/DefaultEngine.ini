GameDefaultMap=/Game/Maps/L_Town.L_Town
GlobalDefaultGameMode=/Script/LastBlock.LBGameMode

[/Script/Engine.RendererSettings]
; iPhone 15 Pro (A17 Pro): mobile deferred renderer, HDR, many dynamic lights, GPU Scene for instancing
r.MobileHDR=True
r.Mobile.ShadingPath=1
r.Mobile.SupportGPUScene=True
r.Mobile.EnableMovableSpotlightsShadow=True
r.Mobile.EnableMovableLightCSMShaderCulling=True
r.Mobile.AntiAliasing=2
r.Mobile.AllowDitheredLODTransition=True
r.Mobile.Forward.EnableClusteredReflections=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.CustomDepth=1
; desktop / Mac editor keeps Lumen for previews, the phone uses the mobile path above
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1

